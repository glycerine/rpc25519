# TLC profile overrides relative to tube.cfg.
# An @ witness is an action property. Other witnesses are state invariants.

# Run the baseline safety checks with one election and no client or heartbeat events.
[quick]
module = tube
spec = MCSpec
MaxHeartbeat = 0
MaxClientReq = 0
inherit_checks = true

# Full bounded two-voter exploration from the ordinary initial state.
[raft]
module = Update
spec = FullUpdateSpec
invariants = MembershipTicketOutcomes
properties = RestartReconcilesLogTerm AppliedPrefixRetained RequestVotePersistedBeforeSend NoPendingOnStepDown
witnesses = BeforeReplicatedWrite
inherit_checks = true

# Interrupt a candidate immediately after durable self-voting.
[restart-vote]
module = Update
spec = CrashCampaignSpec
invariants = MembershipTicketOutcomes
properties = RestartReconcilesLogTerm AppliedPrefixRetained RequestVotePersistedBeforeSend NoPendingOnStepDown
witnesses = BeforeCampaignerRestarts
MaxCrash = 1
MaxRestart = 1
inherit_checks = true

# Race one ordinary removal with its commit evidence, deadline and leader step-down.
[membership]
module = Update
spec = MembershipSpec
invariants = MembershipTicketOutcomes AckedReconfigDurable
properties = RestartReconcilesLogTerm AppliedPrefixRetained RequestVotePersistedBeforeSend NoPendingOnStepDown
witnesses = BeforeMembershipAck @BeforePendingChangeStepsDown
MaxReconfig = 1
MaxElectionTimeout = 2
MaxHeartbeat = 2
MaxClientReq = 0
inherit_checks = true
# CommittedOnQuorum uses the initial voter set. These profiles change membership.
exclude_invariants = CommittedOnQuorum

# Match a numbered configuration, count recycled voter identities, and expire direct or forwarded requests.
[membership-contacts]
module = QuorumChecks
spec = QuorumSpec
invariants = ExpiryOK
properties = DeadlineObserved

# Stable one-voter progress with actual candidate and applied no-op.
[solo-election]
module = Update
spec = SoloElectionSpec
invariants = TypeOK ElectionSafety
properties = SoloEventuallyCommits
Server = {n1}
InitMembers = {n1}
LiveQ = {n1}
LiveB = n1

# Commit a term-one no-op, crash and restart, then fairly elect and commit again in term two.
[post-restart-progress]
module = Update
spec = RecoverElectionSpec
invariants = TypeOK CommitIndexTermSound
properties = PostRestartCommit
Server = {n1}
InitMembers = {n1}
LiveQ = {n1}
LiveB = n1
MaxElectionTimeout = 2
MaxTerm = 2
MaxCrash = 1
MaxRestart = 1

# Twelve explicit WAL, snapshot and AppendEntries/ack fixtures. Every case must complete.
[packet-storage]
module = UpdateCases
spec = FixtureSpec
invariants = TypeOK LogBaseOK FixtureResults
properties = EveryFixtureFinishes

# Operator overrides have separate safety assumptions.
[admin]
module = Update
spec = MCSpecAdmin
invariants = TypeOK AdminRoutingOK
witnesses = BeforeRedirectedForceApplied
MaxReconfig = 1
MaxHeartbeat = 0
MaxClientReq = 0

# Check waiter completion on current and former leaders against follower apply.
[client-ticket]
module = TicketGuardFixture
spec = FixtureSpec
invariants = TwoApplyPaths

[transport]
module = NetworkChecks
spec = NetworkSpec
invariants = NetworkResult
properties = NetworkProgress

[transport-psk]
module = NetworkChecks
spec = NetworkSpec
invariants = NetworkResult
properties = NetworkProgress
EnforceWriteDeadline = <- ExtraChaChaFraming
SyntheticAutoClientAddrs = <- EnableSyntheticAddrs

# Exercise STARTACK after a reverse partition or a saturated setup-reply queue.
[handshake]
module = HandshakeCheck
spec = HandshakeSpec
invariants = TypeOK DialerWaits
properties = NoCollateralTeardown HandshakeFinishes

[identity]
module = IdentityChecks
spec = IdentitySpec
invariants = IdentityResult
properties = IdentityProgress

[kv]
module = tube
spec = MCSpecKV
invariants = KVTypeOK KVSessionIndexes KVLogAgreement KVDeterminism KVSessDeterminism KVExactlyOnce KVReplyMatchesApply KVLeaseMutex
properties = KVLogImmutable
KVClients = {c1}
KVMaxTime = 0
KVMaxLog = 1
KVMaxSerial = 1
MaxKVFailover = 0
MaxKVRetry = 0
MaxKVLocalRead = 0

[kv-cases]
module = KVRegression
spec = KVRegressionSpec
invariants = KVTypeOK KVSessionIndexes KVLogAgreement KVDeterminism KVSessDeterminism KVExactlyOnce KVReplyMatchesApply KVLeaseMutex KVCheckpoints
properties = KVLogImmutable FinishAll
KVClients = {c1,c2}
KVMaxTime = 5
KVDrift = <- MCKVDriftMixed
KVMaxLog = 8
KVMaxSerial = 8
MaxKVFailover = 0
MaxKVRetry = 0
MaxKVLocalRead = 0

[hermes-round]
module = tube
spec = HermesRoundSpec
invariants = HermesTypeOK HermesRoundAgreement HermesPayloads HermesCompletedValue

[hermes-circuits]
module = tube
spec = HermesCircuitSpec
invariants = HermesTypeOK
properties = HermesCircuitCleanup

# Sample joint czar publication and Hermes operation schedules.
[hermes-joint]
module = tube
spec = MCSpecHermes
invariants = HermesTypeOK HermesRoundAgreement
simulation = 200 80

[hermes-replay]
module = HermesWitness
spec = Witness
invariants = HermesTypeOK HermesRoundAgreement HermesPayloads HermesCompletedValue
witnesses = WitnessExpected
require_witness = true

[hermes-publication]
module = HermesPublication
spec = Witness
invariants = HermesTypeOK HermesRoundAgreement
witnesses = Goal
require_witness = true

[campaign]
module = ElectionChecks
spec = R
invariants = TypeOK RProof CandidateVoteDurable
properties = RDone
MaxInc = 2
MaxTerm = 2
MaxCrash = 2
MaxRestart = 2

[bootstrap]
module = ElectionChecks
spec = B
invariants = TypeOK BProof CandidateVoteDurable
properties = BDone
InitMembers = {}
MaxInc = 2
MaxTerm = 2
MaxCrash = 2
MaxRestart = 2

[restart-wal]
module = ElectionChecks
spec = W
invariants = TypeOK WProof CandidateVoteDurable
properties = WDone
MaxInc = 3
MaxTerm = 2
MaxCrash = 3
MaxRestart = 3

[restart-delay]
module = ElectionChecks
spec = D
invariants = TypeOK DProof CandidateVoteDurable
properties = DDone
InitialVoteDelay = 2
RestartVoteDelays = {1}
MaxInc = 3
MaxTerm = 2
MaxCrash = 3
MaxRestart = 3

[singleton-wal]
module = ElectionChecks
spec = S
invariants = TypeOK SProof CandidateVoteDurable
properties = SDone
InitMembers = {n1}
MaxInc = 3
MaxTerm = 2
MaxCrash = 3
MaxRestart = 3
LiveQ = {n1}

[donor]
module = DonorChecks
spec = DonorSpec
invariants = DonorResults TypeOK LogBaseOK
properties = DonorTrialsFinish

[startup-unanimity]
module = StartupCheck
spec = CheckSpec
invariants = ClockCorrect PendingWrite CommitAfterRecheck TypeOK LogBaseOK AppliedLenOK ViewsConsistent BlockedOnlyWhenUp ElectionSafety LogMatching LeaderCompleteness StateMachineSafety
properties = LeaderAppendOnly
witnesses = BeforeCommit
Server = {n1, n2, n3}
InitMembers = {n1, n2, n3}
NoFaultTolServers = {n1}
SendBufCap = 3

[restart-votes]
module = ElectionChecks
spec = H
invariants = TypeOK HProof CandidateVoteDurable
properties = HDone
CoreInit = <- ExistingFollowerInit
MaxInc = 2
MaxTerm = 2
MaxCrash = 2
MaxRestart = 2

[admin-cases]
module = AdminCases
spec = ScenarioSpec
invariants = TypeOK ExpectAdmin
Server = {n1, n2, n3}
MaxHeartbeat = 0
MaxClientReq = 0
MaxReconfig = 1
deadlock = TRUE

[durable-save]
module = DurableChecks
spec = DurableSpec
invariants = ExpectedSave RepeatedSave
witnesses = BeforeSave

[caller-timeout]
module = CallerChecks
spec = CallerSpec
invariants = TypeOK TicketSuccessCommitted CallerResults
properties = TicketResultsStable CallerProgress
InitMembers = {n1}
LiveQ = {n1}

[redirect]
module = RedirectChecks
spec = RedirectSpec
invariants = RedirectResults
properties = RedirectProgress

[ticket-inputs]
module = TicketInputs
spec = FixtureSpec
invariants = CheckTicketInputs CheckAdminRouting
Server = {n1, n2, n3}

# TestLocalReadRetryRenewsSessionOnEveryReplica checks the same failover in Go.
[kv-session-diagnostic]
module = SessionProjection
spec = ProjectSpec
invariants = KVTypeOK KVSessionIndexes KVLogAgreement KVDeterminism KVSessDeterminism KVExactlyOnce KVReplyMatchesApply KVLeaseMutex RenewalRecorded
properties = KVLogImmutable Completed
KVClients = {c1,c2}
KVMaxTime = 5
KVDrift = <- MCKVDriftMixed
KVMaxLog = 8
KVMaxSerial = 8
MaxKVFailover = 0
MaxKVRetry = 0
MaxKVLocalRead = 0
witnesses = BeforeRenewal

# The same failover must expose session divergence under the old cache rule.
[kv-session-cache-control]
module = SessionProjection
spec = ProjectSpec
KVDrift = <- MCKVDriftMixed
KVCanReplayAtApply = <- LegacyCanReplayAtApply
require_witness = true
witnesses = KVSessDeterminism

[czar]
module = tube
spec = MCSpecCzar
invariants = CzTypeOK CzAtMostOneCzarBelief CzSubmittedEpoch CzMemberLeaseBound CzPingGrantBound
CzMembers = {m1}
CzMaxEpoch = 2
MaxCzLost = 0
MaxCzCrash = 0

[czar-contacts]
module = CzarFlow
spec = FlowSpec
invariants = CzTypeOK CzAtMostOneCzarBelief CzSubmittedEpoch CzMemberLeaseBound FlowResult CzPingGrantBound
CzLease = 9
deadlock = TRUE

[czar-handoff]
module = CzarHandoff
spec = HandoffSpec
invariants = CzTypeOK CzAtMostOneCzarBelief CzSubmittedEpoch CzMemberLeaseBound HandoffResult CzPingGrantBound
CzMembers = {m1, m2, m3}
deadlock = TRUE

[hermes-exit]
module = HermesExit
spec = HermesCircuitSpec
invariants = HermesTypeOK
properties = HermesCircuitCleanup
witnesses = NoLateExit
require_witness = true

# Sample a three-voter run with one crash, restart, compaction and ordinary reconfiguration.
[raft-faults]
module = Update
spec = FullUpdateSpec
invariants = MembershipTicketOutcomes
properties = RestartReconcilesLogTerm AppliedPrefixRetained RequestVotePersistedBeforeSend NoPendingOnStepDown
simulation = 300 100
Server = {n1,n2,n3}
InitMembers = {n1,n2,n3}
MaxCrash = 1
MaxRestart = 1
MaxElectionTimeout = 4
MaxTerm = 3
MaxReconfig = 1
MaxLinkDown = 2
MaxCompact = 1
MaxClientReq = 2
MaxHeartbeat = 3
MaxConn = 2
MaxCkt = 2
MaxStop = 1
TimelyHeartbeats = FALSE
inherit_checks = true
# CommittedOnQuorum uses the initial voter set. These profiles change membership.
exclude_invariants = CommittedOnQuorum
