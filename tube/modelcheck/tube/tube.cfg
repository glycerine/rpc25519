\* Bounded safety check for two connected voters, one election and one write.
SPECIFICATION MCSpec
\* A quiet cluster can exhaust its election and heartbeat timer budgets.
CHECK_DEADLOCK FALSE

CONSTANTS
    Server = {n1, n2}
    InitMembers = {n1, n2}
    InitShadows = {}
    Addrs = {"a1"}
    InitAddr = "a1"
    MaxInc = 1
    SendBufCap = 1
    AEBatchCap = 1
    SnapParts = 1
    InitMeshed = TRUE
    TimelyHeartbeats = TRUE
    Nil = Nil

    MaxElectionTimeout = 1
    MaxHeartbeat = 1
    MaxClientReq = 1
    MaxTerm = 1
    MaxQueue = 3
    MaxCrash = 0
    MaxRestart = 0
    MaxAddrChange = 0
    MaxStop = 0
    MaxLinkDown = 0
    MaxReconfig = 0
    MaxCompact = 0
    MaxAuditGC = 0
    MaxTorn = 0
    MaxStallDrop = 0
    MaxParTick = 0
    MaxCkt = 0
    MaxConn = 0

    \* Healthy majority and endpoints for the LiveSpec properties.
    LiveQ = {n1, n2}
    LiveA = n1
    LiveB = n2

    \* KV and czar start in their initial states under MCSpec.
    KVReplicas = {r1, r2}
    KVClients = {c1, c2}
    KVMaxTime = 3
    KVLeaseDur = 2
    KVOff <- MCKVOffSkew
    KVDrift <- MCKVDriftSame
    KVSessDur = 3
    KVMaxLog = 3
    KVMaxSerial = 2
    KVNil = KVNil
    MaxKVFailover = 1
    MaxKVRetry = 1
    MaxKVLocalRead = 1

    CzMembers = {m1, m2}
    CzLease = 3
    CzMinLeft = 1
    CzDrift = 1
    CzMaxEpoch = 3
    CzNil = CzNil
    MaxCzLost = 1
    MaxCzCrash = 1
    MaxCzRestart = 0

INVARIANTS
    TypeOK
    LogBaseOK
    AppliedLenOK
    ViewsConsistent
    BlockedOnlyWhenUp
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety

PROPERTY LeaderAppendOnly
