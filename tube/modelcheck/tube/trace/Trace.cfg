\* Trace.cfg -- trace validation of tube.tla against implementation traces.
\* Trace file: ../traces/trace.ndjson by default; override per run with the
\* JSON environment variable (IOEnv.JSON).
\* Run: JSON=../traces/<name>.ndjson java tlc2.TLC -config Trace.cfg Trace.tla
SPECIFICATION TraceSpec

VIEW TraceView

ALIAS TraceAlias

PROPERTIES TraceMatched

CHECK_DEADLOCK FALSE

CONSTANTS
    \* replica names and the initial membership are read from the trace
    Server <- TraceServer
    InitMembers <- TraceInitMembers
    InitShadows = {}
    \* listen addresses as logged by the harness ("Restart" events carry addr)
    Addrs <- TraceAddresses
    InitAddr = "a1"
    \* Include exactly the incarnations reported by this run.
    MaxInc <- TraceMaxInc
    \* simnet has no kernel send buffers: blocking is not expected in traces
    SendBufCap = 1000
    \* the 300 KB catch-up cap never binds for test-sized entries
    AEBatchCap = 1000
    SnapParts = 1
    \* tests start from cold: startup connectToMC dials every member
    SyntheticAutoClientAddrs <- EnableSyntheticAddrs
    InitMeshed = FALSE
    TimelyHeartbeats = FALSE
    Nil = Nil

    MaxElectionTimeout = 1
    MaxHeartbeat = 1
    MaxClientReq = 1
    MaxTerm = 1
    MaxQueue = 3
    MaxCrash = 0
    MaxRestart = 0
    MaxAddrChange = 0
    MaxStop = 0
    MaxLinkDown = 0
    MaxReconfig = 0
    MaxCompact = 0
    MaxAuditGC = 0
    MaxTorn = 0
    MaxStallDrop = 0
    MaxParTick = 0
    MaxCkt = 0
    MaxConn = 0

    \* Healthy majority and endpoints for the LiveSpec properties.
    LiveQ <- TraceInitMembers
    LiveA <- TraceEndpoint
    LiveB <- TraceEndpoint

    \* KV and czar start in their initial states under MCSpec.
    KVReplicas = {r1, r2}
    KVClients = {c1, c2}
    KVMaxTime = 3
    KVLeaseDur = 2
    KVOff <- MCKVOffSkew
    KVDrift <- MCKVDriftSame
    KVSessDur = 3
    KVMaxLog = 3
    KVMaxSerial = 2
    KVNil = KVNil
    MaxKVFailover = 1
    MaxKVRetry = 1
    MaxKVLocalRead = 1

    CzMembers = {m1, m2}
    CzLease = 3
    CzMinLeft = 1
    CzDrift = 1
    CzMaxEpoch = 3
    CzNil = CzNil
    MaxCzLost = 1
    MaxCzCrash = 1
    MaxCzRestart = 0


INVARIANTS
    \* invariants that hold on every real execution (no fault injection needed)
    TypeOK
    LogBaseOK
    AppliedLenOK
    ViewsConsistent
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety
